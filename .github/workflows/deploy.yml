name: Publier Kasa

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v7

      - name: Installer Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Installer les dependances
        run: npm ci

      - name: Construire le site
        run: npm run build

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v6

      - name: Envoyer le site construit
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Publier le site
        id: deployment
        uses: actions/deploy-pages@v5
